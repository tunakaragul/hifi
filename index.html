
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VINYL ROOM — hi-fi listening bar</title>
<meta name="description" content="Hi-fi listening bar. Menü, etkinlikler ve rezervasyon.">
<meta name="theme-color" content="#120d0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="fallback"><div class="cssdisc"></div></div>
<div id="vignette"></div>

<div id="hud">
  <div id="bar"></div>
  <div id="tag"></div>
  <div id="stat"></div>
</div>
<div id="hint">↓ BİR PLAK SEÇ ↓</div>
<div id="tip"></div>

<nav id="panel" aria-label="Ana menü"></nav>

<div id="page" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="bgdisc"></div>
  <div id="pageBar">
    <div class="brand" id="brand"></div>
    <div id="tabs" role="tablist"></div>
    <button id="closeBtn" aria-label="Kapat">✕</button>
  </div>
  <div id="pageBody"></div>
</div>

<!-- Sıra önemli: kütüphaneler → config → ui → scene3d → main -->
<script src="libs/three.min.js"></script>
<script src="libs/OrbitControls.js"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/scene3d.js"></script>
<script src="js/main.js"></script>
</body>
</html>
