<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VINYL ROOM — hi-fi listening bar</title>
<meta name="description" content="Hi-fi listening bar. Menü, etkinlikler ve rezervasyon.">
<meta name="theme-color" content="#120d0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --serif: 'Cormorant Garamond', 'Playfair Display', Georgia, 'Times New Roman', serif;
    --sans: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    --cream: #f1e6d2; --amber: #e0a458;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: #120d0a; overflow: hidden; font-family: var(--sans); color: var(--cream); }
  canvas { display: block; touch-action: none; }
  button { font-family: inherit; }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1;
              background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(10,6,3,.62) 100%); }

  /* ───── HUD ───── */
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-direction: column; align-items: center;
         padding: 20px 8px 0; pointer-events: none; z-index: 2; text-align: center; }
  #bar { font: 500 clamp(18px, 3.4vw, 28px)/1 var(--serif); letter-spacing: .42em; padding-left: .42em; color: var(--cream);
         text-shadow: 0 0 28px rgba(224,164,88,.55); }
  #tag { font: 400 10px var(--sans); letter-spacing: .38em; color: #b79a73; margin-top: 10px; text-transform: uppercase; }
  #stat { font: 400 10px var(--sans); letter-spacing: .2em; color: #d6a566; margin-top: 10px; min-height: 12px; text-transform: uppercase; }
  #hint { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 2; pointer-events: none;
          color: #e8cfa6; font: 400 11px var(--sans); letter-spacing: .3em; white-space: nowrap;
          animation: pulse 2s ease-in-out infinite; transition: opacity .4s; }
  #hint.off { opacity: 0; animation: none; }
  @keyframes pulse { 0%,100% { opacity: .35; transform: translateX(-50%) translateY(0); } 50% { opacity: 1; transform: translateX(-50%) translateY(-4px); } }
  #tip { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); z-index: 5; color: var(--cream);
         font: 400 11px var(--sans); letter-spacing: .14em; white-space: nowrap; background: rgba(18,12,8,.92);
         padding: 6px 18px; border-radius: 20px; border: 1px solid rgba(224,164,88,.35); pointer-events: none;
         opacity: 0; transition: opacity .12s; max-width: 94vw; overflow: hidden; text-overflow: ellipsis; }
  #tip.on { opacity: 1; }

  /* ───── Alt menü ───── */
  #panel { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 4; display: flex; gap: 6px;
           padding: 8px; border-radius: 999px; background: rgba(22,15,10,.78); border: 1px solid rgba(224,164,88,.25);
           backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); max-width: 100vw; }
  .pb { min-height: 42px; padding: 0 18px; background: transparent; color: #e9d9bd; border: 1px solid rgba(224,164,88,.28);
        border-radius: 999px; font: 500 11px var(--sans); letter-spacing: .18em; text-transform: uppercase; cursor: pointer; white-space: nowrap;
        transition: background .2s, color .2s; }
  .pb:hover { background: rgba(224,164,88,.12); }
  .pb.on { background: var(--amber); color: #1a0f07; border-color: var(--amber); }
  .pb:active { transform: scale(.97); }
  .sep { width: 1px; background: rgba(224,164,88,.25); margin: 6px 2px; }
  @media (max-width: 640px) {
    #panel { left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); transform: none; padding: 6px; border-radius: 22px; }
    .pb { flex: 1; padding: 0 4px; font-size: 9.5px; letter-spacing: .08em; overflow: hidden; text-overflow: ellipsis; min-height: 46px; }
    #hint { bottom: calc(78px + env(safe-area-inset-bottom)); font-size: 10px; }
    #tip { bottom: calc(78px + env(safe-area-inset-bottom)); }
  }

  /* ───── WebGL yoksa yedek ───── */
  #fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 0;
              background: radial-gradient(circle at 50% 40%, #3a2415, #120d0a 70%); }
  body.nogl #fallback { display: flex; }
  body.nogl canvas { display: none; }
  .cssdisc { width: min(70vmin, 520px); aspect-ratio: 1; border-radius: 50%;
             background: radial-gradient(circle, #b5703a 0 14%, #111 14.5% 15%, transparent 15.5%),
                         repeating-radial-gradient(circle, #0b0b0b 0 2px, #1b1b1b 2px 3px);
             animation: spin 6s linear infinite; box-shadow: 0 0 80px rgba(224,164,88,.2); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ═════════ SAYFA KATMANI ═════════ */
  #page { position: fixed; inset: 0; z-index: 10; display: none; overflow: hidden; color: var(--cream);
          --accent: #e0a458; --glow: rgba(224,164,88,.24);
          background: radial-gradient(90% 70% at 78% 8%, var(--glow), transparent 60%),
                      radial-gradient(70% 60% at 6% 100%, rgba(120,60,20,.2), transparent 60%), #130e0a; }
  #page::after { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .08; mix-blend-mode: overlay; z-index: 3;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  #page.show { display: block; }
  #page.fadein { animation: fadein .45s both; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .bgdisc { position: absolute; right: -24vmin; bottom: -24vmin; width: 86vmin; height: 86vmin; border-radius: 50%;
            opacity: .1; pointer-events: none; animation: spin 26s linear infinite;
            background: radial-gradient(circle, var(--accent) 0 16%, #000 16.5% 18.5%, transparent 19%),
                        repeating-radial-gradient(circle, #f1e6d2 0 1px, #000 1px 5px); }

  #pageBar { position: absolute; top: 0; left: 0; right: 0; z-index: 2; padding: 16px 24px 10px;
             display: grid; grid-template-columns: 1fr auto 1fr; grid-template-areas: "brand tabs close"; align-items: center; gap: 12px;
             background: linear-gradient(rgba(19,14,10,.94), rgba(19,14,10,0)); }
  .brand { grid-area: brand; font: 500 15px var(--serif); letter-spacing: .38em; text-transform: uppercase; opacity: .92; }
  #tabs { grid-area: tabs; display: flex; gap: 28px; overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; background: none; border: 0; padding: 10px 0; position: relative; cursor: pointer; white-space: nowrap;
         color: rgba(241,230,210,.5); font: 500 11px var(--sans); letter-spacing: .26em; text-transform: uppercase; transition: color .25s; }
  .tab::after { content: ''; position: absolute; left: 0; right: 0; bottom: 2px; height: 1px; background: var(--accent);
                transform: scaleX(0); transform-origin: left; transition: transform .35s; }
  .tab:hover { color: var(--cream); }
  .tab.on { color: var(--cream); }
  .tab.on::after { transform: scaleX(1); }
  #closeBtn { grid-area: close; justify-self: end; width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(241,230,210,.35);
              background: transparent; color: var(--cream); font-size: 15px; cursor: pointer; transition: background .2s; }
  #closeBtn:hover { background: rgba(241,230,210,.12); }
  @media (max-width: 720px) {
    #pageBar { grid-template-columns: 1fr auto; grid-template-areas: "brand close" "tabs tabs"; padding: 12px 16px 6px; gap: 4px 12px; }
    #tabs { gap: 22px; }
  }

  #pageBody { position: absolute; inset: 0; z-index: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
              padding: 140px 28px calc(70px + env(safe-area-inset-bottom)); }
  @media (max-width: 720px) { #pageBody { padding: 128px 20px calc(70px + env(safe-area-inset-bottom)); } }
  #pageBody > * { max-width: 1000px; margin-left: auto; margin-right: auto; opacity: 0; }
  #pageBody.in > * { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 80ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  .eyebrow { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; color: var(--accent);
             font: 500 10px var(--sans); letter-spacing: .42em; text-transform: uppercase; }
  .eyebrow::before { content: ''; width: 34px; height: 1px; background: var(--accent); }
  h1.pt { font: 500 clamp(46px, 9.5vw, 104px)/.95 var(--serif); letter-spacing: -.01em; margin-bottom: 24px; }
  h1.pt em { font-style: italic; color: var(--accent); }
  p.lead { font: italic 400 clamp(18px, 2.4vw, 24px)/1.5 var(--serif); color: rgba(241,230,210,.78); max-width: 34em; margin-bottom: 48px; }

  /* menü */
  .menu { display: grid; grid-template-columns: 1fr 1fr; }
  .menu .col { padding: 0 48px; }
  .menu .col:first-child { padding-left: 0; }
  .menu .col:last-child { padding-right: 0; border-left: 1px solid rgba(241,230,210,.14); }
  .sidehead { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
  .sidehead .disc { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto;
                    font: 600 22px var(--serif); color: #1a0f07;
                    background: radial-gradient(circle, var(--accent) 0 58%, #0b0705 59% 62%, #1c1612 63%); }
  .sidehead h2 { font: 500 11px var(--sans); letter-spacing: .36em; text-transform: uppercase; color: rgba(241,230,210,.7); }
  ul.tracks { list-style: none; }
  ul.tracks li { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 18px 0; border-bottom: 1px solid rgba(241,230,210,.09); }
  .nm b { display: block; font: 500 24px/1.15 var(--serif); }
  .nm i { display: block; margin-top: 5px; font: 300 13px/1.5 var(--sans); font-style: normal; color: rgba(241,230,210,.58); }
  .pr { font: 500 22px var(--serif); color: var(--accent); white-space: nowrap; }

  /* etkinlik */
  .evlist { border-bottom: 1px solid rgba(241,230,210,.12); }
  .ev { display: grid; grid-template-columns: 96px 1fr auto; gap: 28px; align-items: center; padding: 28px 0; border-top: 1px solid rgba(241,230,210,.12); }
  .dateDisc { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(241,230,210,.15);
              background: radial-gradient(circle, var(--accent) 0 34%, #0b0705 35% 37%, transparent 38%),
                          repeating-radial-gradient(circle, #1d1611 0 2px, #120d0a 2px 4px); }
  .dateDisc b { font: 600 26px var(--serif); color: #1a0f07; }
  .evinfo small { display: block; margin-bottom: 8px; font: 500 10px var(--sans); letter-spacing: .3em; color: var(--accent); text-transform: uppercase; }
  .evinfo h3 { font: 500 clamp(24px, 3.4vw, 34px)/1.1 var(--serif); margin-bottom: 8px; }
  .evinfo p { font: 300 14px/1.6 var(--sans); color: rgba(241,230,210,.65); max-width: 36em; }
  .link { background: none; border: 0; color: var(--accent); cursor: pointer; font: 500 11px var(--sans); letter-spacing: .26em; text-transform: uppercase; white-space: nowrap; }
  .link:hover { text-decoration: underline; text-underline-offset: 6px; }

  /* rezervasyon, hakkımızda */
  .split { display: grid; grid-template-columns: 1fr 1.15fr; gap: 56px; align-items: start; }
  form.res { display: grid; gap: 28px; }
  .field { display: grid; gap: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  label { font: 500 10px var(--sans); letter-spacing: .34em; color: rgba(241,230,210,.6); text-transform: uppercase; }
  input, select, textarea { width: 100%; min-height: 48px; padding: 8px 0; background: transparent; border: 0; border-radius: 0;
         border-bottom: 1px solid rgba(241,230,210,.35); color: var(--cream); font: 400 22px var(--serif); color-scheme: dark; }
  textarea { min-height: 70px; resize: vertical; }
  select option { background: #1a120c; }
  input:focus, select:focus, textarea:focus { outline: none; border-bottom-color: var(--accent); }
  .btn { min-height: 56px; border-radius: 999px; border: 0; background: var(--accent); color: #1a0f07; cursor: pointer;
         font: 600 12px var(--sans); letter-spacing: .3em; text-transform: uppercase; text-decoration: none;
         display: inline-flex; align-items: center; justify-content: center; padding: 0 32px; transition: filter .2s, transform .2s; }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: transparent; color: var(--cream); border: 1px solid rgba(241,230,210,.4); }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
  #resMsg { font: 300 13px/1.6 var(--sans); color: #bfe0c8; min-height: 18px; }
  .story { font: italic 400 clamp(22px, 3.2vw, 34px)/1.45 var(--serif); max-width: 26em; margin-bottom: 56px; color: rgba(241,230,210,.9); }
  .cardbox h3 { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; color: var(--accent);
                font: 500 10px var(--sans); letter-spacing: .42em; text-transform: uppercase; }
  .cardbox h3::before { content: ''; width: 34px; height: 1px; background: var(--accent); }
  .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 14px 0; border-bottom: 1px solid rgba(241,230,210,.1); }
  .kv span:first-child { font: 500 10px var(--sans); letter-spacing: .3em; text-transform: uppercase; color: rgba(241,230,210,.55); }
  .kv span:last-child { font: 500 20px var(--serif); text-align: right; }
  .addr { font: 400 20px/1.5 var(--serif); padding: 14px 0; }
  .foot { display: flex; justify-content: space-between; gap: 12px; margin-top: 80px; padding-top: 22px; border-top: 1px solid rgba(241,230,210,.12);
          font: 300 11px var(--sans); letter-spacing: .24em; text-transform: uppercase; color: rgba(241,230,210,.45); }

  @media (max-width: 760px) {
    .menu { grid-template-columns: 1fr; }
    .menu .col { padding: 0; }
    .menu .col:last-child { border-left: 0; margin-top: 46px; }
    .split { grid-template-columns: 1fr; gap: 40px; }
    .ev { grid-template-columns: 76px 1fr; gap: 18px; }
    .dateDisc { width: 76px; height: 76px; }
    .dateDisc b { font-size: 22px; }
    .ev .link { grid-column: 2; justify-self: start; }
    .grid2 { gap: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    #pageBody > * { opacity: 1 !important; }
  }
</style>
</head>
<body>
<div id="fallback"><div class="cssdisc"></div></div>
<div id="vignette"></div>

<div id="hud">
  <div id="bar"></div>
  <div id="tag"></div>
  <div id="stat"></div>
</div>
<div id="hint">↓ BİR PLAK SEÇ ↓</div>
<div id="tip"></div>

<nav id="panel" aria-label="Ana menü"></nav>

<div id="page" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="bgdisc"></div>
  <div id="pageBar">
    <div class="brand" id="brand"></div>
    <div id="tabs" role="tablist"></div>
    <button id="closeBtn" aria-label="Kapat">✕</button>
  </div>
  <div id="pageBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
'use strict';

/* ══════════════════════════════════════════════════════════════
   ✏ İÇERİK — buradaki her şey ÖRNEKTİR, kendi bilgilerinle değiştir
══════════════════════════════════════════════════════════════ */
const CONFIG = {
  barName: 'VINYL ROOM',
  tagline: 'hi-fi listening bar',
  phone: '+90 555 000 00 00',
  whatsapp: '905550000000',                         // ülke kodu ile, + ve boşluk olmadan
  address: 'Örnek Mah. Plak Sk. No:12, Beyoğlu, İstanbul',
  hours: [['Pzt – Per', '18:00 – 01:00'], ['Cum – Cmt', '18:00 – 03:00'], ['Pazar', 'Kapalı']],
  currency: '₺',
  menu: [
    { side: 'A', title: 'İÇECEKLER', items: [
      ['Old Fashioned', 'Bourbon, şeker, bitter, portakal kabuğu', 340],
      ['Negroni', 'Cin, vermut, campari', 320],
      ['Highball', 'Japon viskisi, soda, limon', 360],
      ['Natürel Şarap', 'Kadeh, günün seçimi', 280],
      ['El Yapımı Limonata', 'Nane, zencefil', 140],
      ['Filtre Kahve', 'Günün çekirdeği', 110],
    ]},
    { side: 'B', title: 'YEMEKLER', items: [
      ['Peynir Tabağı', 'Üç peynir, bal, ceviz, kraker', 380],
      ['Bruschetta', 'Domates, fesleğen, zeytinyağı', 190],
      ['Trüflü Patates', 'Parmesan, taze otlar', 220],
      ['Charcuterie', 'Seçili şarküteri, turşu, ekmek', 460],
    ]},
  ],
  events: [
    { d: '12', m: 'EKİM', day: 'CUMA',  title: 'Vinyl Night: 70s Soul', desc: 'Sadece plaklarla, baştan sona soul gecesi. Konuk DJ.', time: '21:00' },
    { d: '19', m: 'EKİM', day: 'CUMA',  title: 'Dinleme Seansı: Jazz Klasikleri', desc: 'Albüm baştan sona, sessizlikte. Rezervasyon önerilir.', time: '20:00' },
    { d: '26', m: 'EKİM', day: 'CUMA',  title: 'Plak Takası', desc: 'Plaklarını getir, değiş tokuş et.', time: '19:00' },
  ],
  about: {
    story: 'Burada müzik arka plan değil, programın kendisi. Plaklar çalar, ses sistemi iyi kurulmuş bir odada dinlenir. Konuşmak serbest, ama önce bir plak dinleyin.',
    system: [['Pikap', 'Doğrudan tahrikli'], ['Amfi', 'Örnek model'], ['Hoparlör', 'Örnek model'], ['Oda', 'Akustik paneller']],
  },
};

/* sayfalar = plaklar */
const PAGES = [
  { id: 'menu',    title: 'MENÜ',        sub: 'İçecek & Yemek',       c1: '#2a140c', c2: '#e0a458', art: 'circles', tint: [9,9,9] },
  { id: 'events',  title: 'ETKİNLİK',    sub: 'Bu ay çalacaklar',     c1: '#2b1119', c2: '#e0685a', art: 'waves',   tint: [46,10,14] },
  { id: 'reserve', title: 'REZERVASYON', sub: 'Yerini ayırt',         c1: '#12261f', c2: '#8fbf9f', art: 'stripes', tint: [8,30,22] },
  { id: 'about',   title: 'HAKKIMIZDA',  sub: 'Ses sistemi & hikaye', c1: '#2a2216', c2: '#d8c08a', art: 'sun',     tint: [52,30,6] },
];

/* ══════════════════════════════════════════════════════════════
   UI KATMANI (3D'den bağımsız — 3D yoksa da çalışır)
══════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmt = n => CONFIG.currency + n;

/* 3D tarafı burayı doldurur; 3D yoksa bu boş kalır ve site yine çalışır */
const hooks = {
  want: () => {}, mount: () => {}, view: () => {}, play: () => {}, toggle: () => {},
  labelXY: () => [innerWidth / 2, innerHeight / 2],
  settled: () => true,
};

let pageState = 'closed';       // closed | opening | open | closing
let currentPage = null, afterClose = null, pendingReveal = false;

$('bar').textContent = CONFIG.barName;
$('tag').textContent = CONFIG.tagline;
$('brand').textContent = CONFIG.barName;
document.title = `${CONFIG.barName} — ${CONFIG.tagline}`;

/* alt menü çubuğu + sayfa içi sekmeler */
const chips = [], tabEls = [];
PAGES.forEach(p => {
  const c = document.createElement('button');
  c.className = 'pb'; c.textContent = p.title; c.onclick = () => openPage(p.id);
  $('panel').appendChild(c); chips.push([p.id, c]);
  const t = document.createElement('button');
  t.className = 'tab'; t.textContent = p.title; t.setAttribute('role', 'tab'); t.onclick = () => openPage(p.id);
  $('tabs').appendChild(t); tabEls.push([p.id, t]);
});
{
  const sep = document.createElement('div'); sep.className = 'sep'; $('panel').appendChild(sep);
  const pl = document.createElement('button');
  pl.className = 'pb on'; pl.id = 'bPlay'; pl.textContent = '▶ ■'; pl.title = 'Pikabı başlat / durdur';
  pl.style.flex = '0 0 auto'; pl.onclick = () => hooks.toggle();
  $('panel').appendChild(pl);
}
function setNavActive(id) {
  chips.forEach(([i, el]) => el.classList.toggle('on', i === id));
  tabEls.forEach(([i, el]) => el.classList.toggle('on', i === id));
}
function hideHint() { $('hint').classList.add('off'); }

/* ───── Sayfa içerikleri ───── */
const eyebrow = (n, t) => `<div class="eyebrow">N° ${n} — ${t}</div>`;
const kvs  = rows => rows.map(r => `<div class="kv"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
const foot = () => `<div class="foot"><span>${CONFIG.barName}</span><span>${CONFIG.address.split(',')[0]}</span></div>`;

const R = {
  menu(p) {
    const cols = CONFIG.menu.map(sec => `<div class="col">

function setHash(id) { if (location.hash.slice(1) !== id) location.hash = id; }

function openPage(id, instant) {
  const p = PAGES.find(x => x.id === id); if (!p) return;
  hideHint();
  if (pageState === 'closing') { afterClose = id; return; }
  if (pageState === 'open' || pageState === 'opening') {
    if (currentPage && currentPage.id === id) return;
    currentPage = p; hooks.want(id); setHash(id);
    if (pageState === 'open') {
      $('pageBody').classList.remove('in');
      setTimeout(() => { renderPage(p); $('pageBody').classList.add('in'); }, reduce ? 0 : 160);
    } else renderPage(p);
    return;
  }
  currentPage = p; pageState = 'opening'; setHash(id);
  renderPage(p);
  hooks.play(true);
  if (instant) {
    hooks.mount(id); hooks.view('platter', true);
    const pg = $('page');
    pg.style.transition = 'none'; pg.style.clipPath = 'none';
    pg.classList.add('show', 'fadein'); pg.setAttribute('aria-hidden', 'false');
    setTimeout(() => pg.classList.remove('fadein'), 600);
    pageState = 'open'; $('pageBody').classList.add('in');
  } else {
    hooks.want(id); hooks.view('platter', false);
    pendingReveal = true;
  }
}

function doReveal() {
  if (pageState !== 'opening') return;
  const [x, y] = hooks.labelXY(), pg = $('page');
  pg.style.transition = 'none';
  pg.style.clipPath = `circle(0px at ${x}px ${y}px)`;
  pg.classList.add('show'); pg.setAttribute('aria-hidden', 'false');
  void pg.offsetWidth;
  pg.style.transition = reduce ? 'none' : 'clip-path .85s cubic-bezier(.65,0,.25,1)';
  pg.style.clipPath = `circle(150vmax at ${x}px ${y}px)`;
  setTimeout(() => $('pageBody').classList.add('in'), reduce ? 0 : 380);
  setTimeout(() => { if (pageState === 'opening') { pageState = 'open'; pg.style.clipPath = 'none'; $('closeBtn').focus({ preventScroll: true }); } }, reduce ? 0 : 880);
}

function closePage() {
  if (pageState !== 'open') return;
  pageState = 'closing';
  if (location.hash.slice(1)) location.hash = '';
  $('pageBody').classList.remove('in');
  const [x, y] = hooks.labelXY(), pg = $('page');
  pg.style.transition = 'none';
  pg.style.clipPath = `circle(150vmax at ${x}px ${y}px)`;
  void pg.offsetWidth;
  pg.style.transition = reduce ? 'none' : 'clip-path .65s cubic-bezier(.5,0,.3,1)';
  pg.style.clipPath = `circle(0px at ${x}px ${y}px)`;
  setTimeout(() => {
    pg.classList.remove('show'); pg.setAttribute('aria-hidden', 'true');
    pageState = 'closed'; currentPage = null; setNavActive(null);
    hooks.view('default', false);
    if (afterClose) { const id = afterClose; afterClose = null; openPage(id); }
  }, reduce ? 0 : 680);
}

$('closeBtn').onclick = closePage;
function route() {
  const id = location.hash.slice(1);
  if (PAGES.some(p => p.id === id)) {
    if (pageState === 'closed') openPage(id);
    else if ((pageState === 'open' || pageState === 'opening') && currentPage && currentPage.id !== id) openPage(id);
  } else if (pageState === 'open') closePage();
}
window.addEventListener('hashchange', route);
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePage();
});
(function tick() {
  if (pendingReveal && hooks.settled()) { pendingReveal = false; doReveal(); }
  requestAnimationFrame(tick);
})();

function makeWoodTexture(base, vein, plank) {
  const W = 1024, H = 1024, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const cx = cv.getContext('2d');
  cx.fillStyle = base; cx.fillRect(0,0,W,H);
  for (let y = 0; y < H; y++) {
    const n = Math.sin(y*0.35)*0.5 + Math.sin(y*0.071+2)*0.5 + (Math.random()-0.5)*0.9;
    cx.fillStyle = `rgba(${vein},${0.05 + Math.abs(n)*0.08})`; cx.fillRect(0,y,W,1);
  }
  for (let i = 0; i < 140; i++) {
    const y = Math.random()*H, x = Math.random()*W, len = Math.random()*600 + 200;
    cx.strokeStyle = `rgba(${vein},${0.06 + Math.random()*0.1})`; cx.lineWidth = Math.random()*2 + 0.5;
    cx.beginPath(); cx.moveTo(x,y);
    cx.bezierCurveTo(x+len*0.3,y+Math.random()*6-3,x+len*0.6,y+Math.random()*6-3,x+len,y+Math.random()*4-2); cx.stroke();
  }
  if (plank) { cx.fillStyle = 'rgba(0,0,0,0.45)'; for (let y = 0; y < H; y += plank) cx.fillRect(0,y,W,2); }
  const t = canvasTex(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function makeSlatTexture() {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
  const cx = cv.getContext('2d');
  for (let x = 0; x < 512; x += 16) {
    const g = cx.createLinearGradient(x,0,x+16,0);
    g.addColorStop(0,'#1c120b'); g.addColorStop(0.5,'#3a2415'); g.addColorStop(1,'#140d08');
    cx.fillStyle = g; cx.fillRect(x,0,16,128);
  }
  const t = canvasTex(cv); t.wrapS = THREE.RepeatWrapping; return t;
}

/* hoparlörler: 15 hücreli multicell horn + woofer kabini */
function hornCellGeo(mcx, mcy, mw, mh, tcx, tcy, tw, th, depth) {
  /* ağızdan (z=0) boğaza (z=-depth) daralan açık dikdörtgen hücre */
  const v = [
    [mcx-mw/2, mcy-mh/2, 0], [mcx+mw/2, mcy-mh/2, 0], [mcx+mw/2, mcy+mh/2, 0], [mcx-mw/2, mcy+mh/2, 0],
    [tcx-tw/2, tcy-th/2,-depth], [tcx+tw/2, tcy-th/2,-depth], [tcx+tw/2, tcy+th/2,-depth], [tcx-tw/2, tcy+th/2,-depth]
  ];
  const quads = [[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]];
  const pos = [], idx = [];
  quads.forEach((q,k) => { q.forEach(i => pos.push(...v[i])); const b = k*4; idx.push(b,b+1,b+2, b,b+2,b+3); });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

let loaded = null, anim = null, wantRec = null;     // wantRec: istenen sayfa id'si ya da null
const DUR_PATH = 1.2, DUR_DROP = 0.35;

const busy = () => !!anim || wantRec !== (loaded ? loaded.id : null);

function mountOnPlatter(rec) {
  platGroup.add(rec.disc);
  rec.disc.visible = true;
  rec.disc.position.set(0,2.0,0); rec.disc.quaternion.identity(); rec.disc.scale.setScalar(1);
  rec.out = true; loaded = rec;
  if (wantRec) armTarget = CUE_ANGLE;               // iğne plağa insin

}
function mountInstant(rec) {
  if (anim) { anim.rec.disc.visible = false; anim.rec.out = false; scene.add(anim.rec.disc); anim = null; }
  if (loaded && loaded !== rec) { scene.add(loaded.disc); loaded.disc.visible = false; loaded.out = false; loaded = null; }
  mountOnPlatter(rec);
  armAngle = armTarget = CUE_ANGLE; armLift = 0;
}

function placeOnPath(rec, u) {
  const mt = 1-u, d = rec.disc;
  d.position.set(0,0,0)
    .addScaledVector(rec.homePos, mt*mt*mt)
    .addScaledVector(rec.c1, 3*mt*mt*u)
    .addScaledVector(rec.c2, 3*mt*u*u)
    .addScaledVector(P3, u*u*u);
  qTmp.copy(rec.qShelf).slerp(rec.qFlat, ease((u-0.25)/0.6));
  d.quaternion.copy(qTmp);
  d.scale.setScalar(DISC_SCALE + (1-DISC_SCALE) * ease(u/0.8));
}
function startEject() {
  const rec = loaded;
  scene.attach(rec.disc);
  rec.qFlat.copy(rec.disc.quaternion);
  loaded = null;
  anim = { rec, type:'out', phase:0, t:0, fromY:rec.disc.position.y };
  refreshHUD();
}
function startLoad(rec) {
  rec.disc.visible = true; rec.out = true; rec.qFlat.identity();
  placeOnPath(rec,0);
  anim = { rec, type:'in', phase:0, t:0 };
  refreshHUD();
}

function updateJobs(dt) {
  if (!anim) {
    const want = wantRec ? byId(wantRec) : null;
    if (wantRec && !want) wantRec = null;
    if (loaded && loaded !== want) {                // yanlış plak var: önce çıkar
      armTarget = ARM_REST;
      if (armAtRest()) startEject();
    } else if (!loaded && want) {
      armTarget = ARM_REST;
      if (armAtRest()) startLoad(want);
    }
  }
  if (!anim) return;
  const A = anim, d = A.rec.disc;
  A.t += dt;
  if (A.type === 'in') {
    if (A.phase === 0) {
      placeOnPath(A.rec, ease(A.t/DUR_PATH));
      if (A.t >= DUR_PATH) { A.phase = 1; A.t = 0; }
    } else {
      const k = ease(A.t/DUR_DROP);
      d.position.set(PLAT_X, P3.y + (PLAT_SURFACE_Y-P3.y)*k, 0);
      d.quaternion.identity(); d.scale.setScalar(1);
      if (A.t >= DUR_DROP) { anim = null; mountOnPlatter(A.rec); }
    }
  } else {
    if (A.phase === 0) {
      d.position.y = A.fromY + (P3.y-A.fromY) * ease(A.t/DUR_DROP);
      if (A.t >= DUR_DROP) { A.phase = 1; A.t = 0; }
    } else {
      placeOnPath(A.rec, 1 - ease(A.t/DUR_PATH));
      if (A.t >= DUR_PATH) { d.visible = false; A.rec.out = false; anim = null; refreshHUD(); }
    }
  }
}

══════════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
let elapsed = 0, frames = 0;
const REC_R_MIN = 2.5, REC_R_MAX = 5.85;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt; const t = elapsed;

  if (pageState !== 'opening') skip = false;
  animSpeed = pageState === 'open' ? 2.5 : 1;       // sayfa açıkken değişimler arkada hızlı biter
  orbit.enabled = pageState === 'closed' && !uiDrag;

  /* kamera geçişi */
  if (viewTween) {
    const k = damp(skip ? 14 : 5, dt);
    cam.position.lerp(viewTween.pos, k);
    orbit.target.lerp(viewTween.tgt, k);
    if (cam.position.distanceTo(viewTween.pos) < 0.25) {
      cam.position.copy(viewTween.pos); orbit.target.copy(viewTween.tgt); viewTween = null;
    }
  }

  /* pitch + platter motoru */
  pitchDisp += (pitch - pitchDisp) * damp(12,dt);
  if (Math.abs(pitch - pitchDisp) < 0.002) pitchDisp = pitch;
  const target = playing ? nominalOmega() : 0;
  omega += (target - omega) * damp(playing ? 4.5 : 1.4, dt);
  if (!playing && omega < 0.005) omega = 0;
  platGroup.rotation.y += omega * dt;

  /* plak değişimi */
  updateJobs(dt * baseSpeed * animSpeed * (skip ? 5 : 1));

  /* tonearm */
  armAngle += (armTarget - armAngle) * damp(armDragging ? 22 : 14, dt);
  pivG.rotation.y = armAngle; pivG.updateMatrixWorld(true);
  const r = stylusRadius();
  const overRecord = !!loaded && r > REC_R_MIN && r < REC_R_MAX;
  const liftTarget = armDragging ? 0.9 : (overRecord ? 0 : 0.3);
  armLift += (liftTarget - armLift) * damp(armDragging ? 10 : 6, dt);
  hsG.position.y = HS_BASE_Y + armLift;
  if (!armDragging && overRecord && armLift < 0.05 && omega > 1)
    armTarget = Math.max(ARM_MIN, armTarget - 0.0035 * dt * (omega / nominalOmega()));

  /* kılıflar: plak dışarıdaysa öne kayar ve kararır */
  RECORDS.forEach(rec => {
    const s = rec.sleeve;
    s.position.z += ((rec.homePos.z + (rec.out ? 1.4 : 0)) - s.position.z) * damp(6,dt);
    rec.dim += ((rec.out ? 0.35 : 1) - rec.dim) * damp(6,dt);
    s.userData.origColor.setScalar(rec.dim); s.userData.hoverColor.setScalar(rec.dim * 1.3);
    if (hoveredMesh !== s) s.material.color.copy(s.userData.origColor);
  });

  if (ssPressT > 0) {
    ssPressT = Math.min(1, ssPressT + dt / SS_PRESS_DUR);
    ssGroup.position.y = -SS_PRESS_DEPTH * Math.sin(ssPressT * Math.PI);
    if (ssPressT >= 1) { ssGroup.position.y = 0; ssPressT = 0; }
  }
  capGrp.position.z = SZ - (pitchDisp / PMAX) * CR;

  M.bLED.emissiveIntensity  = 1.20 + 0.70 * Math.sin(t * 2.1);
  M.bLED2.emissiveIntensity = 1.00 + 0.60 * Math.sin(t * 1.5 + 0.4);
  ptTgt.intensity = 0.28 + 0.16 * Math.sin(t * 1.5 + 0.4);
  ptSlG.intensity = 0.20 + 0.12 * Math.sin(t * 2.1 + 1.0);

  /* sayfa tamamen açıkken çizimi durdur: pil ve ısınma için */
  if (pageState !== 'open' || frames < 3) {
    orbit.update();
    renderer.render(scene, cam);
    frames++;
  }
}
